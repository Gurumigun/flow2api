<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flow2API Token Updater</title>
  <style>
    body { width: 420px; margin: 0; font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #172033; background: #f6f8fb; }
    main { padding: 20px; }
    h1 { margin: 0 0 18px; color: #1769e0; font-size: 22px; }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; padding: 10px 11px; border: 1px solid #cfd6e4; border-radius: 8px; font-size: 14px; }
    .hint { margin: 6px 0 0; color: #687386; font-size: 12px; line-height: 1.45; }
    .buttons { display: flex; gap: 8px; margin-top: 18px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-weight: 650; cursor: pointer; }
    #save { color: #fff; background: #1769e0; }
    #test { color: #15335e; background: #dfeafb; }
    #status { min-height: 20px; margin-top: 14px; line-height: 1.45; white-space: pre-wrap; }
    .ok { color: #087443; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>🔄 Flow2API Token Updater</h1>

    <label for="apiUrl">연결 주소</label>
    <input id="apiUrl" type="url" placeholder="http://127.0.0.1:8000/api/plugin/update-token">
    <p class="hint">Flow2API 관리 화면의 ‘확장프로그램 연결 설정’에서 복사합니다.</p>

    <label for="connectionToken">연결 Token</label>
    <input id="connectionToken" type="password" autocomplete="off">

    <label for="loginAccount">Google 계정 이메일 (선택)</label>
    <input id="loginAccount" type="email" placeholder="account@gmail.com">
    <p class="hint">여러 Google 계정이 로그인되어 있으면 대상 계정을 지정하세요.</p>

    <label for="refreshInterval">갱신 주기 (분)</label>
    <input id="refreshInterval" type="number" min="30" step="1" value="360">

    <div class="buttons">
      <button id="save" type="button">저장</button>
      <button id="test" type="button">즉시 테스트</button>
    </div>
    <div id="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
